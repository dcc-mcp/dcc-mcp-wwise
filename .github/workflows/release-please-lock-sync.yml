name: Release lock sync

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "src/dcc_mcp_wwise/__version__.py"
      - "src/dcc_mcp_wwise/skills/**/SKILL.md"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-release-lock:
    name: Sync generated release lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
      startsWith(github.event.pull_request.title, 'chore(main): release ')
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Regenerate the exact release lock
        run: |
          python -m pip install "uv==0.11.19"
          uv lock
      - name: Commit the generated lock only when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already synchronized."
            exit 0
          fi
          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git add uv.lock
          git commit -m "chore(ci): sync generated release lock"
          git push origin "HEAD:${HEAD_REF}"

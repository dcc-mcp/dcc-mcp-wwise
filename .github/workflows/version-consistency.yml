name: Version consistency

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "src/dcc_mcp_wwise/__version__.py"
      - "src/dcc_mcp_wwise/skills/**/SKILL.md"
      - "scripts/ci/check_uv_lock.py"
      - ".github/workflows/release-please-lock-sync.yml"
      - ".github/workflows/version-consistency.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  version-consistency:
    name: Check release version and lock consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate version-bearing metadata
        run: python scripts/ci/check_uv_lock.py
      - name: Validate generated lock state
        run: |
          python -m pip install "uv==0.11.19"
          uv lock --check

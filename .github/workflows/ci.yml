name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core-version: ["0.20.14", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the allowed Core lane
        env:
          CORE_VERSION: ${{ matrix.core-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CORE_VERSION" = "latest" ]; then
            CORE_REQUIREMENT="dcc-mcp-core>=0.20.14,<1.0.0"
          else
            CORE_REQUIREMENT="dcc-mcp-core==$CORE_VERSION"
          fi
          python -m pip install -e ".[dev]" "$CORE_REQUIREMENT" "waapi-client==0.8.1"
      - run: python -m pip check
      - run: python scripts/ci/check_installed_dependencies.py
      - run: pytest tests/test_doctor.py tests/test_release_contract.py -q

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.14"
      - run: ruff check src tests tools scripts
      - run: ruff format --check src tests tools scripts
      - run: python scripts/ci/check_installed_dependencies.py
      - run: python scripts/ci/check_workflows.py
      - name: Doctor contract smoke
        run: pytest tests/test_doctor.py -q
      - run: pytest
      - run: python tools/lint_skills.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "uv==0.11.19"
      - run: python scripts/ci/check_uv_lock.py
      - run: python scripts/ci/check_workflows.py
      - run: uv lock --check
      - run: python -m pip check
      - run: python scripts/ci/check_installed_dependencies.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_wheel.py dist/*.whl
      - name: Wheel entry-point smoke
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install "dcc-mcp-core==0.20.14" dist/*.whl
          wheel-smoke/bin/dcc-mcp-wwise --version
          set +e
          wheel-smoke/bin/dcc-mcp-wwise doctor --json --timeout-ms 0 > doctor.json
          code=$?
          set -e
          test "$code" -eq 10
          wheel-smoke/bin/python -m pip install "jsonschema>=4.17,<5"
          wheel-smoke/bin/python -c "import json; from jsonschema import Draft202012Validator; from dcc_mcp_core.deployment import load_install_sop_schema; Draft202012Validator(load_install_sop_schema()).validate(json.load(open('doctor.json', encoding='utf-8')))"

  process-boundary:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.14"
      - run: python -m pytest tests/test_waapi_probe.py -q
